name: Build Mac RediSearch

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install cmake rust || true
          
          # 从 GitHub 源码直接安装 Redis 官方的 cheadergen
          pip3 install setuptools wheel --break-system-packages || true
          pip3 install git+https://github.com/RedisLabsModules/cheadergen.index.git@master --break-system-packages || \
          pip3 install git+https://github.com/RedisLabsModules/cheadergen.git@master --break-system-packages || true

          # 确保全局可执行
          CHEADERGEN_PATH=$(which cheadergen || find /Users/runner -name cheadergen 2>/dev/null | head -n 1)
          echo "Found cheadergen at: $CHEADERGEN_PATH"
          if [ -n "$CHEADERGEN_PATH" ]; then
            sudo mkdir -p /usr/local/bin
            sudo ln -sf "$CHEADERGEN_PATH" /usr/local/bin/cheadergen
          fi

      - name: Build RediSearch
        run: |
          export PATH="/usr/local/bin:$HOME/.local/bin:$PATH"
          git submodule update --init --recursive
          make build IGNORE_MISSING_DEPS=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redisearch-macos-dylib
          path: |
            bin/macos-*/search/redisearch.dylib
            bin/darwin-*/search/redisearch.dylib
            build/redisearch.dylib
            bin/*/redisearch.dylib
            bin/macos-aarch64-release/search-community/redisearch.dylib
