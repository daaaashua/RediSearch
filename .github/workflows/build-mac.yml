name: Build Mac RediSearch

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build RediSearch
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install cmake rust || true
          
          # 1. 强行源码安装 cheadergen
          pip3 install git+https://github.com/RedisLabsModules/cheadergen.git --break-system-packages || true
          
          # 2. 创建系统可执行 wrapper 脚本
          sudo mkdir -p /usr/local/bin
          echo '#!/usr/bin/env bash' | sudo tee /usr/local/bin/cheadergen
          echo 'python3 -m cheadergen "$@"' | sudo tee -a /usr/local/bin/cheadergen
          sudo chmod +x /usr/local/bin/cheadergen

          # 3. 设置环境变量
          export PATH="/usr/local/bin:$PATH"
          export CHEADERGEN_EXECUTABLE="/usr/local/bin/cheadergen"
          
          # 4. 拉取子模块并编译（显式将变量覆盖给 CMake）
          git submodule update --init --recursive
          make build IGNORE_MISSING_DEPS=1 CMAKE_ARGS="-DCHEADERGEN_EXECUTABLE=/usr/local/bin/cheadergen"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redisearch-macos-dylib
          path: |
            bin/macos-*/search/redisearch.dylib
            bin/darwin-*/search/redisearch.dylib
            build/redisearch.dylib
            bin/*/redisearch.dylib
            bin/macos-aarch64-release/search-community/redisearch.dylib
